[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Unit test suite for isolated calculation functions
    edge: Edge-case, boundary, and intentional failure gate tests
    integration: Integration and API route contract tests
    e2e: End-to-end feature user journey tests on deployed UAT
